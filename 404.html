<!--CondensedHTMLForLoadTime-->
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Attachment</title><style>body{margin:0;min-height:100vh;background:#111;display:flex;justify-content:center;align-items:center;color: white;}img,video{max-width:96vw;max-height:96vh;object-fit:contain;}p{color: white;font-family: Arial, sans-serif;}</style></head><body><div id="viewer"><p>Loading attachment</p></div><script>const WORKER="https://media-upload-worker.difubit.workers.dev";const prefix="/attachments/";const path=location.pathname;const filename=path.startsWith(prefix)?path.slice(prefix.length):"";const valid=/^[a-f0-9-]{36}\.(jpg|png|gif|webp|avif|mp4|webm|mov)$/i;const viewer=document.getElementById("viewer");if(!valid.test(filename)){viewer.textContent = "Attachment not found.";} else{const isVideo=/\.(mp4|webm|mov)$/i.test(filename);const media=document.createElement(isVideo?"video": "img");if(isVideo){media.controls=true;media.playsInline=true;}else{media.alt="Uploaded attachment";}media.src=`${WORKER}/media/${encodeURIComponent(filename)}`;media.onerror=()=>{viewer.textContent="Attachment could not be loaded.";};viewer.replaceChildren(media);}</script></body></html>
