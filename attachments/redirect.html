<!doctype html>
<html>
  <head>
    <style>
      body {
        background-color: rgb(24, 24, 24);
        margin: 0;
        min-height: 100vh;
      }
      #media-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 12px;
      }
      img,
      video {
        max-width: 100%;
        max-height: 90vh;
      }
      #sound-btn {
        color: white;
        padding: 10px 24px;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        background: rgba(15, 15, 15, 0.9);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="media-container"></div>

    <script>
      async function loadMedia() {
        const params = new URLSearchParams(window.location.search);
        const wantsAudio = params.has("a");

        const res = await fetch(
          "https://image-proxy.difubit.workers.dev/?t=" + Date.now(),
        );
        const url = (await res.text()).trim();
        const container = document.getElementById("media-container");

        const ext = url.split("?")[0].split(".").pop().toLowerCase();
        const videoExts = ["mp4", "webm", "mov", "ogg"];
        const imageExts = ["png", "jpg", "jpeg", "gif", "webp", "svg"];

        if (videoExts.includes(ext)) {
          const el = document.createElement("video");
          el.src = url;
          el.controls = true;
          el.loop = true;
          el.playsInline = true;
          container.appendChild(el);

          if (wantsAudio) {
            // ?a: unmuted
            el.muted = false;
            el.autoplay = false;
          } else {
            // default (no param)
            el.muted = true;
            el.autoplay = true;

            const btn = document.createElement("button");
            btn.id = "sound-btn";
            btn.textContent = "Click to enable audio";
            btn.onclick = () => {
              el.muted = false;
              el.play();
              btn.remove();
            };
            container.appendChild(btn);
          }
        } else if (imageExts.includes(ext)) {
          const el = document.createElement("img");
          el.src = url;
          container.appendChild(el);
        } else {
          const el = document.createElement("img");
          el.src = url;
          container.appendChild(el);
        }
      }

      const params = new URLSearchParams(window.location.search);

if (!params.has("moving")) {
  const url = new URL(window.location.href);
  url.searchParams.set("moving", "1");

  const popup = window.open(
    url.href,
    "_blank",
    "width=900,height=700,resizable=yes"
  );

  if (popup) {
    let x = 0;
    let y = 0;
    let dx = 15;
    let dy = 15;

    setInterval(() => {
      if (popup.closed) return;

      const maxX = screen.availWidth - 900;
      const maxY = screen.availHeight - 700;

      x += dx;
      y += dy;

      if (x <= 0 || x >= maxX) {
        dx = -dx;
        x = Math.max(0, Math.min(x, maxX));
      }

      if (y <= 0 || y >= maxY) {
        dy = -dy;
        y = Math.max(0, Math.min(y, maxY));
      }

      popup.moveTo(x, y);
    }, 10);
  }
}

      loadMedia();
    </script>
  </body>
</html>
