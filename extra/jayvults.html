<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jayvaults countdown</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="countdown.css" />
  </head>
  <body>
    <h2 class="gabarito-mainfont">the jayvaults mass unfollowing countdown</h2>
    <div id="countdown">
      <div class="time-unit">
        <span id="days">00</span>
        <p>days</p>
      </div>
      <div class="time-unit">
        <span id="hours">00</span>
        <p>hours</p>
      </div>
      <div class="time-unit">
        <span id="minutes">00</span>
        <p>minutes</p>
      </div>
      <div class="time-unit">
        <span id="seconds">00</span>
        <p>seconds</p>
      </div>
    </div>
    <br>
    <div>
      <h3 class="gabarito-mainfont">how to participate</h3>
      <p class="gabarito-secondaryfont">1. follow jayvaults if you haven't already<br>2. when the countdown hits 00:00:00:00 unfollow jayvaults</p>
      <a href="https://twitch.tv/jayvaults" class="gabarito-mainfont">twitch.tv/jayvaults</a>
      <br>
      <br>
      <br>
      <img src="image.png" style="width: 250px;display:block;justify-self:center;">
    </div>
  </body>
</html>
<script>
  const tDate = new Date("2026-09-01T00:00:00-05:00").getTime();
  const timer = setInterval(function () {
    const now = new Date().getTime();
    const distance = tDate - now;
    const days = Math.max(Math.floor(distance / (1000 * 60 * 60 * 24)));
    const hours = Math.max(Math.floor(
      (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60),
    ));
    const minutes = Math.max(Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)));
    const seconds = Math.max(Math.floor((distance % (1000 * 60)) / 1000));
    document.getElementById("days").innerText = String(days).padStart(2, '0');
    document.getElementById("hours").innerText = String(hours).padStart(2, '0');
    document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
    document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');

    if (distance < 0) {
      clearInterval(timer);
      document.getElementById("countdown").innerText = "mass unfollowing starts now...";
    }
  }, 1000);
</script>
