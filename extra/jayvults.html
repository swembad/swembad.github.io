<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jayvaults countdown</title>
    <link rel="stylesheet" href="../base.css" />
    <link rel="stylesheet" href="countdown.css" />
  </head>
  <body>
    <h2 class="gabarito-mainfont">the jayvaults mass unfollowing countdown</h2>
    <div id="countdown">
      <div class="time-unit">
        <span id="days">00</span>
        <p>days</p>
      </div>
      <div class="time-unit">
        <span id="hours">00</span>
        <p>hours</p>
      </div>
      <div class="time-unit">
        <span id="minutes">00</span>
        <p>minutes</p>
      </div>
      <div class="time-unit">
        <span id="seconds">00</span>
        <p>seconds</p>
      </div>
    </div>
    <br/>
    <div>
      <h3 class="gabarito-mainfont">how to participate</h3>
      <p class="gabarito-secondaryfont">
        1. follow jayvaults if you haven't already<br />2. when the countdown
        hits 00:00:00:00 unfollow jayvaults
      </p>
      <a href="https://twitch.tv/jayvaults" class="gabarito-mainfont"
        >twitch.tv/jayvaults</a
      >
      <br/>
      <br/>
      <div id="followers">
        <h2 id="follower-count" class="gabarito-mainfont" style="margin-top:0; margin-bottom:0; transition: color 0.2s">0</h2>
        <h3 class="gabarito-secondaryfont" style="margin-top:0">followers</h3>
        <p class="gabarito-secondaryfont">updates every 10 seconds</p>
      </div>
      <img
        src="image.png"
        style="width: 250px; display: block; justify-self: center"
      />
    </div>
  </body>
</html>
<script>
  const tDate = new Date("2026-09-01T00:00:00-00:00").getTime();
  const timer = setInterval(function () {
    const now = new Date().getTime();
    const distance = tDate - now;
    const days = Math.max(Math.floor(distance / (1000 * 60 * 60 * 24)));
    const hours = Math.max(
      Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
    );
    const minutes = Math.max(
      Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
    );
    const seconds = Math.max(Math.floor((distance % (1000 * 60)) / 1000));
    document.getElementById("days").innerText = String(days).padStart(2, "0");
    document.getElementById("hours").innerText = String(hours).padStart(2, "0");
    document.getElementById("minutes").innerText = String(minutes).padStart(
      2,
      "0",
    );
    document.getElementById("seconds").innerText = String(seconds).padStart(
      2,
      "0",
    );
    if (distance <= 0) {
      document.getElementById("days").innerText = "00";
      document.getElementById("hours").innerText = "00";
      document.getElementById("minutes").innerText = "00";
      document.getElementById("seconds").innerText = "00";
      clearInterval(timer);
      return;
    }
  }, 1000);

  let previousFollowers = null;
  async function updateFollowers() {
    try {
      const response = await fetch(
        "https://api.twitch.tv/helix/channels/followers?broadcaster_id=721512078",
        {
          headers: {
            "Client-ID": "ttgxrwl2bo094c4evbxquu3gizj4c3",
            Authorization: "Bearer eelye1jkj0xcub7d5z01oqrzwb83jk",
          },
        }
      );
      const data = await response.json();
      const newFollowers = data.total;
      const followerCount = document.getElementById("follower-count");
      followerCount.textContent = newFollowers.toLocaleString();

      if (previousFollowers !== null) {
        if (newFollowers > previousFollowers) {
          followerCount.style.color = "green";
        } else if (newFollowers < previousFollowers) {
          followerCount.style.color = "red";
        }

        setTimeout(() => {
          followerCount.style.color = "";
        }, 2000);
      }
      previousFollowers = newFollowers;

    } catch (error) {
      console.error("Failed to fetch follower count:", error);
    }
  }
  updateFollowers();

  setInterval(updateFollowers, 10000);
</script>
